<!-- Define el documento base, metadatos y punto de montaje del frontend web. -->
<!doctype html>
<html
  lang="es"
  data-theme="light"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#a20c8c"
    />
    <link
      rel="icon"
      href="/logo-alertamujer.jpeg"
    />
    <title>AlertaMujer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('am.theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.lang =
        localStorage.getItem('am.language') === 'en' ? 'en' : 'es';
    </script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
